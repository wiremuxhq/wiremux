[package]
name = "wiremux"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reserved."
publish = false
keywords = []
categories = []

[[bin]]
name = "wiremux"
path = "src/bin/wiremux.rs"

[features]
default = ["proxy"]
# HTTP server stack for `wiremux proxy`. Lib dependents can set
# default-features = false to stay on maps + profile types only.
proxy = [
    "dep:bytes",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
]

[dependencies]
bytes = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive"] }
http = { version = "1.5", optional = true }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.11.1", optional = true, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", optional = true, features = ["tokio"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
wiremux-auth = { path = "../wiremux-auth" }

[dev-dependencies]
tempfile = "3.23.0"
