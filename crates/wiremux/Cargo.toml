[package]
name = "wiremux"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reserved."
publish = false
keywords = []
categories = []

[[bin]]
name = "wiremux"
path = "src/bin/wiremux.rs"
required-features = ["cli"]

[features]
# Maps + re-exported profile types. Set default-features = false.
default = ["cli", "proxy"]
# Binary helpers (validate, login, status).
cli = ["dep:clap", "dep:tokio"]
# HTTP server stack for `wiremux proxy`. Needs cli listen/token helpers.
proxy = [
    "cli",
    "dep:bytes",
    "dep:futures-util",
    "dep:http",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:reqwest",
    "dep:tokio",
]

[dependencies]
bytes = { version = "1", optional = true }
clap = { version = "4.5", optional = true, features = ["derive"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
http = { version = "1.5", optional = true }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.11.1", optional = true, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", optional = true, features = ["tokio"] }
reqwest = { version = "0.12.24", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1.48.0", optional = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
wiremux-auth = { path = "../wiremux-auth" }

[dev-dependencies]
tempfile = "3.23.0"
