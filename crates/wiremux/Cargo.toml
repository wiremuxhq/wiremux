[package]
name = "wiremux"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reserved."
publish = true
keywords = []
categories = []

[[bin]]
name = "wiremux"
path = "src/bin/wiremux.rs"
required-features = ["cli"]

[features]
# Maps + re-exported profile types. Set default-features = false.
default = ["cli", "proxy"]
# Binary helpers (validate, login, status).
cli = ["dep:clap", "dep:tokio"]
# HTTP server stack for `wiremux proxy`. Needs cli listen/token helpers.
proxy = [
    "cli",
    "dep:bytes",
    "dep:futures-util",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:reqwest",
    "dep:tokio",
]
# Optional library POST/SSE. Does NOT pull clap / hyper / cli.
client = ["dep:bytes", "dep:futures-util", "dep:reqwest", "dep:tokio"]

[dependencies]
bytes = { version = "1", optional = true }
clap = { version = "4.5", optional = true, features = ["derive"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.11.1", optional = true, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", optional = true, features = ["tokio"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1.48.0", optional = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
wiremux-auth = { version = "0.5.0", path = "../wiremux-auth" }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
wiremux-auth = { path = "../wiremux-auth", features = ["test-util"] }
