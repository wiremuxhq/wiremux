[package]
name = "wiremux"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wiremux maps Chat Completions, Messages, Responses, Gemini, and Converse through one IR."
publish = true
documentation = "https://docs.rs/wiremux"
readme = "../../README.md"
keywords = ["llm", "openai", "anthropic", "proxy"]
categories = ["network-programming", "api-bindings"]

[[bin]]
name = "wiremux"
path = "src/bin/wiremux.rs"
required-features = ["cli"]

[[example]]
name = "remap"
required-features = []

[[example]]
name = "remap_gemini"
required-features = []

[features]
# Maps + re-exported profile types. Set default-features = false.
# That path keeps wiremux-auth default-features off (no HTTP / TLS / aws-lc).
default = ["cli", "proxy"]
# Binary helpers (validate, login, status).
cli = ["dep:clap", "dep:reqwest", "dep:tokio", "wiremux-auth/net", "wiremux-auth/pkce", "wiremux-auth/device"]
# HTTP server stack for `wiremux proxy`. Needs cli listen/token helpers.
proxy = [
    "cli",
    "dep:bytes",
    "dep:futures-util",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:reqwest",
    "dep:tokio",
]
# Optional library POST/SSE. Does NOT pull clap / hyper / cli.
client = ["dep:bytes", "dep:futures-util", "dep:reqwest", "dep:tokio", "wiremux-auth/net"]

[dependencies]
bytes = { version = "1", optional = true }
clap = { version = "4.5", optional = true, features = ["derive"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std"] }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.11.1", optional = true, features = ["http1", "server"] }
hyper-util = { version = "0.1.20", optional = true, features = ["tokio"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1"
thiserror = "2.0.20"
tokio = { version = "1.48.0", optional = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
wiremux-auth = { version = "0.8.0", path = "../wiremux-auth", default-features = false }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
wiremux-auth = { path = "../wiremux-auth", default-features = false, features = ["test-util"] }
