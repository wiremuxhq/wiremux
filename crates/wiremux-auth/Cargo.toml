[package]
name = "wiremux-auth"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reserved."
publish = true
keywords = []
categories = []

[features]
default = ["pkce", "device"]
pkce = ["dep:getrandom"]
device = []
# Public IsolatedHome helper. Not a runtime API.
test-util = ["dep:tempfile"]

[dependencies]
fs4 = { version = "1.1.0", features = ["sync"] }
hmac = "0.13"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["fs", "io-util", "rt", "sync", "time"] }
toml = "1.1"
tracing = "0.1.41"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
getrandom = { version = "0.4", optional = true }
sha2 = "0.11"
tempfile = { version = "3.23.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4.2"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
wiremux-auth = { path = ".", features = ["test-util"] }
