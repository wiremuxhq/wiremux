[package]
name = "wiremux-auth"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wiremux TokenProvider, vendor profile catalog, and pasteable OAuth packs."
publish = true
documentation = "https://docs.rs/wiremux-auth"
readme = "../../README.md"
keywords = ["oauth", "authentication", "llm", "oidc"]
categories = ["authentication", "network-programming"]

[features]
# Profile parse/load/overlay, shipped presets, types, envsubst, IsolatedHome.
# TokenProviders and HTTP/TLS/JWT live on `net`.
default = ["net", "pkce", "device"]
# OAuth / GCP / Azure / AWS TokenProviders. jsonwebtoken stays 10.x + aws_lc_rs.
net = [
    "dep:reqwest",
    "dep:tokio",
    "dep:jsonwebtoken",
    "dep:hmac",
    "dep:sha2",
    "dep:keyring",
]
pkce = ["net", "dep:getrandom"]
device = ["net"]
# Public IsolatedHome helper. Not a runtime API.
test-util = ["dep:tempfile"]

[dependencies]
fs4 = { version = "1.1.0", features = ["sync"] }
hmac = { version = "0.13", optional = true }
jsonwebtoken = { version = "10", optional = true, default-features = false, features = ["use_pem", "aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.48.0", optional = true, features = ["fs", "io-util", "rt", "sync", "time"] }
toml = "1.1"
tracing = "0.1.41"
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "form", "rustls"] }
getrandom = { version = "0.4", optional = true }
sha2 = { version = "0.11", optional = true }
tempfile = { version = "3.23.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2", optional = true }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
wiremux-auth = { path = ".", features = ["test-util"] }

[[test]]
name = "overlay"
required-features = ["net"]

[[test]]
name = "shipped_presets"
required-features = ["net"]

[[test]]
name = "token_provider"
required-features = ["net", "pkce", "device"]
