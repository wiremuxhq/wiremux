name: Dependabot auto-merge

on: # zizmor: ignore[dangerous-triggers] job does not checkout the PR head
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Dependabot auto-merge
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "Skipping major version update. It needs manual review."
      - name: Approve and enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr review --repo "$REPO" --approve "$PR"
          gh pr merge --repo "$REPO" --auto --squash "$PR"
