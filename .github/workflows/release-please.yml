# Cheap promote job on push to main. Syncs Cargo.lock on the open
# release PR. Does not run the product test matrix.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # release-please opens the version PR and later tags
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-pr-versions:
    name: Sync release PR lock
    needs: release-please
    # release-please-action leaves `pr` empty on a no-op main push
    # (chore/docs). Look up the open autorelease PR instead.
    if: >-
      always() && !failure() && !cancelled() &&
      needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - name: Resolve release-please head
        id: branch
        env:
          PR_JSON: ${{ needs.release-please.outputs.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name=""
          if [ -n "${PR_JSON}" ] && [ "${PR_JSON}" != "null" ]; then
            name=$(printf '%s\n' "$PR_JSON" | jq -r '.headBranchName // empty')
          fi
          if [ -z "${name}" ] || [ "${name}" = "null" ]; then
            name=$(gh pr list --label "autorelease: pending" --state open \
              --json headRefName --jq '.[0].headRefName // empty')
          fi
          if [ -z "${name}" ]; then
            echo "OK: no open release PR"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - name: Checkout workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.branch.outputs.name != ''
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.branch.outputs.name != ''
        with:
          ref: ${{ github.sha }}
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.branch.outputs.name != ''
        with:
          ref: ${{ steps.branch.outputs.name }}
          path: release
          persist-credentials: false
      - name: Install clang for the fuzz lock refresh
        if: steps.branch.outputs.name != ''
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends clang
      - uses: ./.github/actions/rust-ci
        if: steps.branch.outputs.name != ''
        with:
          toolchain-file: release/rust-toolchain.toml
      - name: Refresh Cargo.lock workspace versions
        if: steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          REPO: ${{ github.repository }}
        working-directory: release
        run: |
          set -euo pipefail
          SYNC_ROOT="$PWD" bash ../publisher/scripts/sync-cargo-lock-workspace-versions.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/wiremux/Cargo.toml
          git add fuzz/Cargo.lock
          if git diff --cached --quiet; then
            echo "OK: Cargo.lock already matches crate versions"
            exit 0
          fi
          git commit -s -m "chore: sync Cargo.lock workspace versions"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push origin "HEAD:${BRANCH}"

  publish-crates:
    name: Publish crates.io
    needs: release-please
    if: >-
      always() && !failure() && !cancelled() &&
      needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish-crates.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  apply-release-notes:
    name: Apply release notes
    needs: release-please
    if: >-
      always() && !failure() && !cancelled() &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_NOTES: ${{ vars.RELEASE_NOTES }}
      RELEASE_NOTES_TAG: ${{ vars.RELEASE_NOTES_TAG }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply curated notes
        continue-on-error: true
        run: bash scripts/apply-release-notes.sh

  # GITHUB_TOKEN tags do not start Release binaries. workflow_dispatch does.
  dispatch-release-binaries:
    name: Dispatch release binaries
    needs: release-please
    if: >-
      always() && !failure() && !cancelled() &&
      needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2
        with:
          egress-policy: audit
      - name: Dispatch Release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "FAIL: tag_name is empty" >&2
            exit 1
          fi
          gh workflow run "Release binaries" --repo "$GH_REPO" -f "tag=${TAG}"
          echo "OK: dispatched Release binaries for ${TAG}"
