# Portable CLI archives for a vX.Y.Z GitHub Release.
# Does not publish Homebrew, winget, Scoop, or Chocolatey.
name: Release binaries

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.3)"
        required: true
        type: string

concurrency:
  group: release-binaries-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: Linux x64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macOS arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x64
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/rust-ci
      - name: Build wiremux
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo build --release --locked -p wiremux --bin wiremux
      - name: Package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/release/wiremux"
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then
            bin="${bin}.exe"
          fi
          python3 scripts/package_release_binary.py \
            --binary "$bin" \
            --target "$TARGET" \
            --out dist \
            --license LICENSE \
            --license LICENSE-APACHE
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiremux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Upload to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wiremux-*
          path: dist
          merge-multiple: true
      - name: Upload archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_DIR: dist
        run: bash scripts/upload-release-binaries.sh
