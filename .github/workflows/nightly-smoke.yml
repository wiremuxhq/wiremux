name: Nightly smoke

on:
  schedule:
    - cron: "27 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-smoke:
    name: Fuzz target smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: target/ci-fuzz
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-ci
        with:
          toolchain: nightly
          components: ""
      - name: Prepend nightly toolchain to PATH
        run: dirname "$(rustup which --toolchain nightly cargo)" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            fuzz
          shared-key: fuzz
          cache-on-failure: true
          save-if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      - name: Build and smoke-run fuzz targets
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          # taiki-e cargo-fuzz is a musl binary. cargo-fuzz then defaults
          # --target to musl, and ASAN refuses statically linked libc.
          cargo fuzz build --target x86_64-unknown-linux-gnu
          fail=0
          cargo fuzz run --target x86_64-unknown-linux-gnu sse_frames -- -max_total_time=5 &
          pid_sse=$!
          cargo fuzz run --target x86_64-unknown-linux-gnu eventstream -- -max_total_time=5 &
          pid_es=$!
          wait "$pid_sse" || fail=1
          wait "$pid_es" || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: fuzz target smoke failed" >&2
            exit 1
          fi

  report-failure:
    name: Report fuzz failure
    needs: fuzz-smoke
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or close the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ vars.NIGHTLY_FAILURE_ASSIGNEE || 'SebTardif' }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: fuzz-smoke=${{ needs.fuzz-smoke.result }}
        run: |
          python3 scripts/report-scheduled-failure.py \
            --prefix "Nightly fuzz red" \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL" \
            --label nightly-failure \
            --label ready
