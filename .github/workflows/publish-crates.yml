# Publish on a vX.Y.Z tag via crates.io trusted publishing (OIDC).
# publish = true. A tag job publishes wiremux-auth then wiremux.
# GitHub Release assets are the packaged .crate plus *.intoto.jsonl.
name: Publish crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.2)"
        required: true
        type: string

concurrency:
  group: publish-crates-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish crates.io
    # workflow_call inherits the caller's event_name. A call from
    # release-please.yml on push to main is event_name=push and
    # event.created=false, so event_name == 'workflow_call' never
    # matches (0.3.0 skip). inputs.tag is set on call and dispatch.
    # Keep created so a signed-tag force-update does not republish.
    if: >-
      github.event_name != 'push' ||
      github.event.created ||
      inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      # Crate tree stays on the tag. The wrapper lives on the
      # workflow revision so dispatch can publish tags that
      # predate this file without dirtying the package.
      # Root checkout makes ./.github/actions/rust-ci resolvable.
      - name: Checkout workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: publisher
      - name: Checkout crate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          path: crate
      - uses: ./.github/actions/rust-ci
        with:
          toolchain-file: crate/rust-toolchain.toml
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates
        working-directory: crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash ../publisher/scripts/publish-crates.sh
      - name: Package release crates
        id: package
        working-directory: crate
        run: bash ../publisher/scripts/package-release-crates.sh
      - name: Attest wiremux-auth
        id: attest-auth
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.auth_crate }}
      - name: Attest wiremux
        id: attest-wiremux
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.wiremux_crate }}
      - name: Upload crate and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          AUTH_CRATE: ${{ steps.package.outputs.auth_crate }}
          WIREMUX_CRATE: ${{ steps.package.outputs.wiremux_crate }}
          AUTH_BUNDLE: ${{ steps['attest-auth'].outputs['bundle-path'] }}
          WIREMUX_BUNDLE: ${{ steps['attest-wiremux'].outputs['bundle-path'] }}
        run: bash publisher/scripts/upload-release-assets.sh
