name: CI

on:
  pull_request:
  merge_group: {}
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # dorny/paths-filter reads the pull request diff
  pull-requests: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # PR-only. merge_group and workflow_dispatch skip this job and run
  # the heavy jobs. A failed changes job must fail the gates.
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      crates: ${{ steps.filter.outputs.crates }}
      scripts: ${{ steps.filter.outputs.scripts }}
      lint_only: ${{ steps.filter.outputs.lint_only }}
      ci: ${{ steps.filter.outputs.ci }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          token: ${{ github.token }}
          filters: |
            crates:
              - 'crates/**'
              - 'fuzz/**'
              - 'presets/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            scripts:
              - 'scripts/**'
            lint_only:
              - 'deny.toml'
              - 'rustfmt.toml'
            ci:
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/zizmor.yml'
              - '.github/actionlint.yaml'
              - 'release-please-config.json'

  # Check name `Stealth` is required by main-branch-protection.
  # The body asserts public surfaces, not the old Not ready stub.
  stealth:
    name: Stealth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public surfaces
        run: bash scripts/assert-public.sh

  lint:
    name: Lint run
    needs: changes
    if: >-
      always() &&
      (needs.changes.result == 'skipped' ||
       needs.changes.outputs.crates == 'true' ||
       needs.changes.outputs.scripts == 'true' ||
       needs.changes.outputs.lint_only == 'true' ||
       needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: target/ci-lint
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public surfaces
        run: bash scripts/assert-public.sh
      - uses: ./.github/actions/rust-ci
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny@0.20.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' }}
      - run: cargo fmt --check
      - name: Full clippy
        if: >-
          github.event_name != 'pull_request' ||
          (!startsWith(github.head_ref, 'release-please') || github.event.pull_request.user.login != 'github-actions[bot]')
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p wiremux --all-targets --no-default-features --features client -- -D warnings
      - name: Rustdoc
        if: >-
          github.event_name != 'pull_request' ||
          (!startsWith(github.head_ref, 'release-please') || github.event.pull_request.user.login != 'github-actions[bot]')
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --workspace
      - name: Release-please check
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'release-please') &&
          github.event.pull_request.user.login == 'github-actions[bot]'
        run: cargo check --locked --workspace --all-targets
      - run: cargo deny check
      - name: Cargo package
        if: >-
          github.event_name != 'pull_request' ||
          (!startsWith(github.head_ref, 'release-please') || github.event.pull_request.user.login != 'github-actions[bot]')
        run: bash scripts/check-cargo-package.sh
      - run: python3 scripts/test_workflow_triggers.py
      - run: python3 scripts/test_package_release_binary.py
      - run: python3 scripts/test_render_release_extras.py
      - run: python3 scripts/test_upload_release_binaries.py

  lint-gate:
    name: Lint
    needs: [changes, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Require lint success or skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JOB_RESULT: ${{ needs.lint.result }}
        run: |
          set -euo pipefail
          case "$CHANGES_RESULT" in
            failure|cancelled)
              echo "FAIL: changes job ${CHANGES_RESULT}" >&2
              exit 1
              ;;
          esac
          case "$JOB_RESULT" in
            success|skipped) echo "OK: ${JOB_RESULT}" ;;
            *)
              echo "FAIL: lint ${JOB_RESULT}" >&2
              exit 1
              ;;
          esac

  workflows:
    name: Workflow lint
    needs: changes
    if: >-
      always() &&
      (needs.changes.result == 'skipped' ||
       needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: zizmor@1.16.0
      - run: python3 scripts/test_workflow_triggers.py
      - run: python3 scripts/test_package_release_binary.py
      - run: python3 scripts/test_render_release_extras.py
      - run: python3 scripts/test_upload_release_binaries.py
      - run: zizmor --min-severity=high .github/workflows .github/actions

  workflows-gate:
    name: Workflows
    needs: [changes, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Require workflow lint success or skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JOB_RESULT: ${{ needs.workflows.result }}
        run: |
          set -euo pipefail
          case "$CHANGES_RESULT" in
            failure|cancelled)
              echo "FAIL: changes job ${CHANGES_RESULT}" >&2
              exit 1
              ;;
          esac
          case "$JOB_RESULT" in
            success|skipped) echo "OK: ${JOB_RESULT}" ;;
            *)
              echo "FAIL: workflow lint ${JOB_RESULT}" >&2
              exit 1
              ;;
          esac

  # Job-level if cannot read matrix. A release-please PR gets ubuntu only
  # so macOS and Windows runners are not started. The Test gate still
  # reports when those legs are absent.
  test-os:
    name: Test OS list
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.set.outputs.os }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Choose OS legs
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Only the release-please bot skips macOS and Windows.
          if [ "$EVENT_NAME" = "pull_request" ] && [[ "$HEAD_REF" == release-please* ]] && [ "$ACTOR" = "github-actions[bot]" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: [changes, test-os]
    if: >-
      always() &&
      (needs.changes.result == 'skipped' ||
       needs.changes.outputs.crates == 'true' ||
       needs.changes.outputs.scripts == 'true' ||
       needs.changes.outputs.ci == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.test-os.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      # test-summary/action publishes a check run
      checks: write
    env:
      CARGO_TARGET_DIR: target/ci-test
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-ci
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        if: >-
          github.event_name != 'pull_request' ||
          (!startsWith(github.head_ref, 'release-please') || github.event.pull_request.user.login != 'github-actions[bot]')
        with:
          tool: cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' }}
      - name: Unit and integration tests
        if: >-
          github.event_name != 'pull_request' ||
          (!startsWith(github.head_ref, 'release-please') || github.event.pull_request.user.login != 'github-actions[bot]')
        shell: bash
        run: |
          set -euo pipefail
          out="${CARGO_TARGET_DIR}/junit"
          mkdir -p "$out"
          cargo nextest run --locked --workspace --profile ci
          cp target/nextest/ci/junit.xml "${out}/default.xml"
          cargo test --locked -p wiremux --no-default-features --test request_maps --test stream_maps --test response_maps --test stream_grammar
          cargo test --locked -p wiremux --no-default-features --features client --lib --test client --test consume_notes --test response_maps
          cargo check --locked -p wiremux --no-default-features --features cli
          cargo check --locked -p wiremux --no-default-features --features proxy
          bash scripts/assert-maps-only-deps.sh
      - name: Doc tests
        if: >-
          github.event_name != 'pull_request' ||
          (!startsWith(github.head_ref, 'release-please') || github.event.pull_request.user.login != 'github-actions[bot]')
        run: cargo test --locked --workspace --doc
      - name: Release-please check
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'release-please') &&
          github.event.pull_request.user.login == 'github-actions[bot]'
        run: cargo check --locked --workspace --all-targets
      - name: Test summary
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           (!startsWith(github.head_ref, 'release-please') || github.event.pull_request.user.login != 'github-actions[bot]'))
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: target/ci-test/junit/*.xml
          show: all

  test-gate:
    name: Test
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - name: Require test success or skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JOB_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          case "$CHANGES_RESULT" in
            failure|cancelled)
              echo "FAIL: changes job ${CHANGES_RESULT}" >&2
              exit 1
              ;;
          esac
          case "$JOB_RESULT" in
            success|skipped) echo "OK: ${JOB_RESULT}" ;;
            *)
              echo "FAIL: test ${JOB_RESULT}" >&2
              exit 1
              ;;
          esac
