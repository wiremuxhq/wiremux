extensions:
  - addsTo:
      pack: codeql/rust-all
      extensible: barrierModel
    data:
      # https_token_url returns only an https URL. The token endpoint
      # string is not a secret, and the POST body is the OAuth token request.
      - [
          "wiremux_auth::helpers::https_token_url",
          "ReturnValue.Field[core::option::Option::Some(0)]",
          "request-url",
          "manual",
        ]
      - [
          "wiremux_auth::helpers::https_token_url",
          "ReturnValue.Field[core::option::Option::Some(0)]",
          "transmission",
          "manual",
        ]
