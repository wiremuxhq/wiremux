name: Rust CI toolchain
description: Install the toolchain from rust-toolchain.toml, then sccache.

inputs:
  toolchain-file:
    description: rust-toolchain.toml path relative to GITHUB_WORKSPACE
    required: false
    default: rust-toolchain.toml
  toolchain:
    description: Channel override. Empty reads toolchain-file.
    required: false
    default: ""
  components:
    description: Components override used with toolchain. Empty installs none.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve toolchain
      id: parse
      shell: bash
      env:
        TOOLCHAIN_FILE: ${{ inputs.toolchain-file }}
        TOOLCHAIN_OVERRIDE: ${{ inputs.toolchain }}
        COMPONENTS_OVERRIDE: ${{ inputs.components }}
      run: |
        set -euo pipefail
        if [ -n "${TOOLCHAIN_OVERRIDE}" ]; then
          echo "channel=${TOOLCHAIN_OVERRIDE}" >> "$GITHUB_OUTPUT"
          echo "components=${COMPONENTS_OVERRIDE}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        file="${GITHUB_WORKSPACE}/${TOOLCHAIN_FILE}"
        if [ ! -f "$file" ]; then
          echo "::error::toolchain file missing: ${file}"
          exit 1
        fi
        channel=""
        components=""
        while IFS= read -r line || [ -n "$line" ]; do
          case "$line" in
            *channel*)
              if [ -z "$channel" ]; then
                rest=${line#*\"}
                channel=${rest%%\"*}
              fi
              ;;
          esac
          case "$line" in
            *components*"["*"]"*)
              inner=${line#*[}
              inner=${inner%]*}
              components=$(printf '%s' "$inner" | tr -d '" ')
              ;;
          esac
        done < "$file"
        if [ -z "$channel" ]; then
          echo "::error::channel missing in ${file}"
          exit 1
        fi
        {
          echo "channel=${channel}"
          echo "components=${components}"
        } >> "$GITHUB_OUTPUT"
    - name: Install toolchain
      if: steps.parse.outputs.components != ''
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: ${{ steps.parse.outputs.channel }}
        components: ${{ steps.parse.outputs.components }}
    - name: Install toolchain without components
      if: steps.parse.outputs.components == ''
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: ${{ steps.parse.outputs.channel }}
    - name: Install sccache
      uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
      with:
        tool: sccache@0.18.0
    - name: Wrap rustc with sccache
      shell: bash
      run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
    - name: Expose Actions cache credentials
      # Shell steps do not receive the cache URL. A JavaScript action does.
      # Fork pull requests must not write the cache.
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          const url = process.env.ACTIONS_RESULTS_URL || process.env.ACTIONS_CACHE_URL || ''
          const token = process.env.ACTIONS_RUNTIME_TOKEN || ''
          if (!url || !token) {
            core.setFailed('Actions cache credentials are missing')
            return
          }
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '')
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', token)
          if (process.env.ACTIONS_CACHE_SERVICE_V2) {
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2)
          }
    - name: Enable sccache GHA cache
      shell: bash
      # An explicit false is not the same as leaving the variable unset.
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      run: echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
